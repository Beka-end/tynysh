<!-- Supabase → Authentication → Emails → Templates → Magic Link -->
<!-- Тема письма: Код для входа в Tynysh -->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F6F3FF;padding:32px 12px;font-family:'Nunito',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">
  <tr><td align="center">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#FFFFFF;border-radius:20px;padding:32px 28px;">

      <tr><td style="font-size:26px;font-weight:800;color:#5B4BDB;letter-spacing:-0.02em;padding-bottom:20px;">
        tynysh
      </td></tr>

      <tr><td style="font-size:17px;line-height:1.5;color:#241F3B;padding-bottom:20px;">
        Привет! Вот твой код для входа:
      </td></tr>

      <tr><td align="center" style="padding-bottom:20px;">
        <div style="background:#F6F3FF;border-radius:16px;padding:20px;font-size:34px;font-weight:800;color:#5B4BDB;letter-spacing:0.16em;">
          {{ .Token }}
        </div>
      </td></tr>

      <tr><td style="font-size:15px;line-height:1.5;color:#5F5A78;padding-bottom:22px;">
        Введи его на странице входа. Код действует один час.
      </td></tr>

      <tr><td align="center" style="padding-bottom:22px;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#5B4BDB;color:#FFFFFF;font-size:16px;font-weight:700;text-decoration:none;padding:14px 28px;border-radius:14px;">
          Или войти одной кнопкой
        </a>
      </td></tr>

      <tr><td style="font-size:13px;line-height:1.5;color:#9C97AE;border-top:1px solid #EEEAFF;padding-top:18px;">
        Если ты не запрашивал вход — просто не открывай это письмо и никому не показывай код.
      </td></tr>

    </table>
  </td></tr>
</table>
